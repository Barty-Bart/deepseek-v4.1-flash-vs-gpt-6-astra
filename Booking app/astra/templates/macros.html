{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h2m4 0h2"/>
{% elif name == 'pin' %}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>
{% elif name == 'scissors' %}<circle cx="5" cy="6" r="3"/><circle cx="5" cy="18" r="3"/><path d="m7 8 14 13M7 16 21 3M13 10l3 3"/>
{% elif name == 'beard' %}<path d="M5 4v8c0 5 7 9 7 9s7-4 7-9V4M5 10l4 2 3-2 3 2 4-2m-10 6 3 2 3-2"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'link' %}<path d="m10 13 4-4m-5 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m0 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/>
{% endif %}</svg>
{%- endmacro %}

{% macro picker_field(id, name, label, value='', type='date', min='', max='', step='', closed_days='', picker_label='') -%}
<div class="field-group">
  <label for="{{ id }}">{{ label }}</label>
  <div class="picker-field">
    <input id="{{ id }}" name="{{ name }}" type="{{ type }}" value="{{ value }}" data-picker-label="{{ picker_label or label }}" {% if min %}min="{{ min }}"{% endif %} {% if max %}max="{{ max }}"{% endif %} {% if step %}step="{{ step }}"{% endif %} {% if closed_days %}data-closed-days="{{ closed_days }}"{% endif %} required>
    <button type="button" class="picker-alternative" data-picker-for="{{ id }}" aria-label="{{ picker_label or label }}: {{ 'calendar' if type == 'date' else 'time' }} options" title="{{ 'Choose from calendar' if type == 'date' else 'Choose from time list' }}" hidden>{{ icon('calendar' if type == 'date' else 'clock', 20) }}</button>
  </div>
</div>
{%- endmacro %}
